name: CI-CD Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      infra_changed: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-platform:
              - 'src/backend/general-web-backend/core-platform/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            template-service:
              - 'src/backend/general-web-backend/template-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            server-service:
              - 'src/backend/general-web-backend/server-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            steam-cache-service:
              - 'src/backend/general-web-backend/steam-cache-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            node-gateway:
              - 'src/agent/**'
            admin:
              - 'src/frontend/admin/**'
            customer:
              - 'src/frontend/customer/**'
            infra:
              - 'deploy/**'

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

  infra-sync:
    name: Infra config sync trigger
    needs: detect-changes
    if: needs.detect-changes.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Infra config changed — deploy will sync deploy/ directory."
