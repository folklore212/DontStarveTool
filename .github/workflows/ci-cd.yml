name: CI-CD

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  # ── Phase 1: Detect what changed ──
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.service-list.outputs.services || steps.manual.outputs.changes }}
      infra: ${{ steps.filter.outputs.infra || steps.manual.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Set all services for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "changes=[\"core-platform\",\"template-service\",\"server-service\",\"steam-cache-service\",\"node-gateway\",\"admin\",\"customer\",\"test\"]" >> $GITHUB_OUTPUT
          echo "infra=true" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            core-platform:
              - 'src/backend/general-web-backend/core-platform/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            template-service:
              - 'src/backend/general-web-backend/template-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            server-service:
              - 'src/backend/general-web-backend/server-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            steam-cache-service:
              - 'src/backend/general-web-backend/steam-cache-service/**'
              - 'src/backend/general-web-backend/common/**'
              - 'src/backend/general-web-backend/pom.xml'
            node-gateway:
              - 'src/agent/**'
            admin:
              - 'src/frontend/admin/**'
            customer:
              - 'src/frontend/customer/**'
            infra:
              - 'deploy/**'
              - '.github/workflows/**'
            test:
              - 'deploy/services/test/**'

      - name: Convert filter changes to service array
        id: service-list
        if: github.event_name != 'workflow_dispatch'
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          SERVICES=$(echo "$CHANGES" | jq -c '[to_entries[] | select(.key != "infra" and .value == true) | .key]')
          echo "services=${SERVICES}" >> $GITHUB_OUTPUT

  # ── Phase 2: Quality gate ──
  test:
    name: Compile + Test
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/agent/go.sum

      - name: Maven compile
        run: cd src/backend/general-web-backend && ./mvnw compile -q

      - name: Java unit tests
        run: cd src/backend/general-web-backend && ./mvnw test -Dtest='*Test,*Tests,!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: TypeScript check (admin)
        run: cd src/frontend/admin && npm install --legacy-peer-deps && npx tsc --noEmit

      - name: TypeScript check (customer)
        run: cd src/frontend/customer && npm install --legacy-peer-deps && npx tsc --noEmit

      - name: Go build + test + vet
        run: cd src/agent && go build ./... && go test ./... && go vet ./...

  # ── Phase 3: Build and push Docker images to ACR ──
  build-and-push:
    name: Build ${{ matrix.service }}
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/dst-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Phase 4: Deploy to production ──
  deploy:
    name: Deploy to production
    needs: [detect-changes, test, build-and-push]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to server via tar/SSH pipe
        timeout-minutes: 5
        run: |
          mkdir -p ~/.ssh
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add - >/dev/null
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          for i in 1 2 3; do
            echo "=== Deploy file transfer attempt $i ==="
            tar cz -C . deploy/ | ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p /opt/dst && tar xz -C /opt/dst" && break
            echo "Attempt $i failed, sleeping 5..."
            sleep 5
          done

      - name: Deploy via SSH
        timeout-minutes: 15
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            echo "=== ACR login ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username ${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
            cd /opt/dst/deploy

            # Set REGISTRY so docker compose pulls from ACR, not Docker Hub
            export REGISTRY=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/

            for svc in core-platform template-service server-service steam-cache-service node-gateway admin customer test; do
              echo "  Pulling $svc ..."
              docker compose pull "$svc"
            done
            echo "=== Recreate changed services ==="
            docker compose up -d
            echo "=== Health check ==="
            bash scripts/health-check.sh
