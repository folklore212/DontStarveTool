name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-build:
    name: Maven Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile all modules
        working-directory: src/backend/general-web-backend
        run: chmod +x mvnw && ./mvnw compile -q

  backend-test:
    name: Maven Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        working-directory: src/backend/general-web-backend
        run: chmod +x mvnw && ./mvnw test -pl common,core-platform,server-service,template-service,steam-cache-service -Dtest='*Test,*Tests,!*IntegrationTest,!GeneralWebBackendApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  frontend-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, customer]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and type-check
        working-directory: src/frontend/${{ matrix.app }}
        run: npm install --legacy-peer-deps && npx tsc --noEmit

  go-build:
    name: Go Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build and test
        working-directory: src/agent
        run: go build ./... && go test ./...
