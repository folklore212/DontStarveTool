name: Deploy Only

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, default: all)'
        required: false
        default: 'all'
        type: string

jobs:
  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Update deploy files on server
        uses: appleboy/ssh-action@v1.2.2
        timeout-minutes: 5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eo pipefail
            mkdir -p /opt/dst/deploy
            echo "=== Downloading deploy files from GitHub ==="
            curl -sL --retry 3 --retry-delay 5 --connect-timeout 10 \
              https://github.com/folklore212/DontStarveTool/archive/refs/heads/master.tar.gz \
              | tar xz --strip=2 -C /opt/dst/deploy DontStarveTool-master/deploy/
            echo "=== Files updated ==="
            ls /opt/dst/deploy/

      - name: Deploy via SSH
        timeout-minutes: 10
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== ACR login ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username ${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
            cd /opt/dst/deploy

            SERVICES="${{ github.event.inputs.services }}"
            if [ "$SERVICES" = "all" ]; then
              for svc in core-platform template-service server-service steam-cache-service node-gateway admin customer test; do
                echo "=== Pulling $svc ==="
                docker compose pull "$svc"
              done
            else
              echo "$SERVICES" | tr ',' '\n' | while read svc; do
                svc=$(echo "$svc" | xargs)
                [ -z "$svc" ] && continue
                echo "=== Pulling $svc ==="
                docker compose pull "$svc"
              done
            fi

            echo "=== Recreate changed services ==="
            docker compose up -d
            echo "=== Health check ==="
            bash scripts/health-check.sh
