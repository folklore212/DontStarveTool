name: Deploy Only

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, default: all)'
        required: false
        default: 'all'
        type: string

jobs:
  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to server via tar/SSH pipe
        timeout-minutes: 5
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          for i in 1 2 3; do
            echo "=== Deploy file transfer attempt $i ==="
            tar cz -C . deploy/ | ssh -i /tmp/ssh_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -o PasswordAuthentication=no \
              -v \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p /opt/dst && tar xz -C /opt/dst" 2>&1 && break
            echo "Attempt $i failed, sleeping 5..."
            sleep 5
          done
          rm -f /tmp/ssh_key

      - name: Deploy via SSH
        timeout-minutes: 15
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            echo "=== ACR login ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username ${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
            cd /opt/dst/deploy

            # Set REGISTRY so docker compose pulls from ACR, not Docker Hub
            export REGISTRY=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/

            SERVICES="${{ github.event.inputs.services }}"
            if [ "$SERVICES" = "all" ]; then
              for svc in core-platform template-service server-service steam-cache-service node-gateway admin customer test; do
                echo "=== Pulling $svc ==="
                docker compose pull "$svc"
              done
            else
              echo "$SERVICES" | tr ',' '\n' | while read svc; do
                svc=$(echo "$svc" | xargs)
                [ -z "$svc" ] && continue
                echo "=== Pulling $svc ==="
                docker compose pull "$svc"
              done
            fi

            echo "=== Recreate changed services ==="
            docker compose up -d
            echo "=== Health check ==="
            bash scripts/health-check.sh
