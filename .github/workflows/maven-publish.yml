name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw package -DskipTests -q
        working-directory: src/backend/general-web-backend

  frontend:
    name: Frontend (Admin + Customer)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, customer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/${{ matrix.app }}

      - name: Build
        run: npm run build
        working-directory: src/${{ matrix.app }}
