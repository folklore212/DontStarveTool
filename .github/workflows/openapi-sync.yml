name: Sync OpenAPI to Docs

on:
  push:
    branches: [master]
    paths:
      - 'src/backend/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-openapi:
    name: Generate and Sync OpenAPI Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        run: |
          cd src/backend/general-web-backend
          ./mvnw clean package -DskipTests -B

      - name: Start Services
        run: |
          cd deploy/docker
          docker compose up -d mysql core-platform
          echo "Waiting for services to start..."
          sleep 30

      - name: Wait for Core Platform
        run: |
          echo "Checking service health..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -s http://localhost:8081/actuator/health > /dev/null; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Waiting for service... (attempt $((attempt + 1))/$max_attempts)"
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "Service failed to start"
          exit 1

      - name: Export OpenAPI JSON
        run: |
          mkdir -p doc/_static/static
          curl -s http://localhost:8081/v3/api-docs > doc/_static/static/openapi.json
          curl -s http://localhost:8081/v3/api-docs.yaml > doc/_static/static/openapi.yaml

          # Validate JSON
          if ! python -m json.tool doc/_static/static/openapi.json > /dev/null; then
            echo "Generated OpenAPI JSON is invalid"
            exit 1
          fi

          echo "OpenAPI spec generated successfully"

      - name: Stop Services
        run: |
          cd deploy/docker
          docker compose down
        if: always()

      - name: Check for Changes
        id: git-check
        run: |
          git diff --quiet doc/_static/static/openapi.* || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions@github.com"
          git add doc/_static/static/openapi.*
          git commit -m "chore: auto-sync OpenAPI spec [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-sync OpenAPI spec"
          title: "chore: update OpenAPI specification"
          body: |
            ## OpenAPI Specification Update

            This PR was automatically generated by the OpenAPI sync workflow.

            ### Changes
            - Updated `openapi.json`
            - Updated `openapi.yaml`

            ### Review
            Please review the changes to ensure:
            - [ ] All new endpoints are documented
            - [ ] Request/response schemas are correct
            - [ ] Endpoint descriptions are clear

            ---
            *Automatically generated by GitHub Actions*
          branch: chore/auto-sync-openapi
          delete-branch: true

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: generate-openapi
    if: failure()

    steps:
      - name: Notify Failure
        run: |
          echo "::error::OpenAPI sync failed. Please check the workflow logs."
          # 可以添加发送到 Slack/钉钉的通知
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"OpenAPI sync failed!"}' \
          #   ${{ secrets.WEBHOOK_URL }}
