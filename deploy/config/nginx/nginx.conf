events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream core_platform {
        server core-platform:8081;
    }
    upstream template_service {
        server template-service:8082;
    }
    upstream server_service {
        server server-service:8083;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Core Platform (auth, users, roles)
        location /api/v1/auth/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://core_platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id "";
        }
        location /api/v1/users/ {
            proxy_pass http://core_platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/roles/ {
            proxy_pass http://core_platform;
            proxy_set_header Host $host;
        }

        # Template Service (templates, worldgen, marketplace)
        location /api/v1/templates/ {
            proxy_pass http://template_service;
            proxy_set_header Host $host;
            proxy_set_header X-User-Roles $http_x_user_roles;
        }
        location /api/v1/worldgen/ {
            proxy_pass http://template_service;
            proxy_set_header Host $host;
        }

        # Server Service (servers, clusters)
        location /api/v1/servers/ {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Workshop (mod-worker)
        location /api/v1/workshop/ {
            proxy_pass http://template_service;
            proxy_set_header Host $host;
        }

        # Health endpoints
        location /actuator/ {
            proxy_pass http://core_platform;
        }

        # Node Agent WebSocket
        location /node {
            proxy_pass http://node-gateway:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }
    }
}
