# Test profile properties
# Use smtp.example.com placeholder to trigger dev mode code logging
spring.mail.host=smtp.example.com
spring.mail.port=1025
spring.mail.username=noreply@example.com
spring.mail.password=dev

# Disable Flyway entirely
spring.flyway.enabled=false

# JWT keys (copied from main resources)
jwt.private-key=classpath:jwt-private.pem
jwt.public-key=classpath:jwt-public.pem
jwt.access-token-ttl=900
jwt.refresh-token-ttl=604800

# Disable cache warmup for tests
app.cache.warmup.enabled=false

# GeeTest dummy keys
geetest.login.captcha-id=dummy
geetest.login.captcha-key=dummy
geetest.register.captcha-id=dummy
geetest.register.captcha-key=dummy

# Snowflake
snowflake.datacenter-id=1
snowflake.worker-id=1

# Crypto dummy keys
crypto.aes-keys.1=22l9HkgiXovn9NFOuDcfPhwDj34ndUoeSPvsB0txFt4=
crypto.aes-keys.0=bsIrtp+vEV/FQcRemimotQ51UADxtVu9I6AADlOmDfI=

# CORS
app.cors.allowed-origins=*

# Logging
logging.level.com.iccuu=DEBUG
