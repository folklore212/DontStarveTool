<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:40px 0;">
        <tr>
            <td align="center">
                <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                    <tr>
                        <td style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:32px 40px;text-align:center;">
                            <h1 style="color:#ffffff;font-size:22px;font-weight:700;margin:0;letter-spacing:1px;">ICCU Identity Verification</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:40px;">
                            <p style="color:#333333;font-size:15px;line-height:1.6;margin:0 0 24px 0;">Hello!</p>
                            <p style="color:#333333;font-size:15px;line-height:1.6;margin:0 0 24px 0;">You are <b th:text="${purpose}">registering</b>. Your verification code is:</p>
                            <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f9ff;border:2px dashed #667eea;border-radius:8px;margin:0 0 24px 0;">
                                <tr>
                                    <td style="padding:28px 24px;text-align:center;">
                                        <span style="font-family:'SF Mono','Monaco','Consolas','Courier New',monospace;font-size:36px;font-weight:700;color:#667eea;letter-spacing:10px;" th:text="${code}">123456</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="color:#888888;font-size:13px;line-height:1.8;margin:0 0 4px 0;">This code is valid for <b th:text="${minutes}">5</b> minutes. Do not share it with anyone.</p>
                            <p style="color:#888888;font-size:13px;line-height:1.8;margin:0;">If this was not you, please ignore this email.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#fafafa;padding:20px 40px;text-align:center;border-top:1px solid #eeeeee;">
                            <p style="color:#bbbbbb;font-size:12px;margin:0;">This is an automated message. Please do not reply.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
