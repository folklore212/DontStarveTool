server:
  port: 8084

spring:
  application:
    name: steam-cache-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/dst_templates?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:A4s7kQ2xP9mF3vR8}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Z8bT3rL5wN1qJ6yD}
  flyway:
    enabled: false

dst:
  scheduled:
    workshop-cache:
      enabled: true

steam:
  api:
    key: ${STEAM_API_KEY:}
